[build-system]
requires = ["hatchling>=1.24,<1.32"]
build-backend = "hatchling.build"

[project]
name = "glplot"
version = "0.1.6"
description = "High-performance OpenGL plotting library for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Juan Manuel Lombardi", email = "lombardi@fhi-berlin.mpg.de" }
]
keywords = ["plotting", "opengl", "visualization", "gpu", "scientific plotting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    # Capped below 3.10, not just floored at 3.6: matplotlib 3.10 and 3.11 each raised
    # their own minimum Python version (3.10 needs Python>=3.10; 3.11 needs Python>=3.11).
    # With no ceiling, `pip install` on this project's own Python 3.9-3.12 CI matrix was
    # silently resolving three *different* matplotlib releases depending on which Python
    # ran it, and their APIs had already drifted from each other (e.g. 3.11 made
    # Animation's event_source parameter mandatory, 3.9 has voxels() without the
    # axlim_clip matplotlib added later) -- so no single GLPlot signature could match
    # "matplotlib" across the matrix, because there wasn't one. This keeps the whole
    # matrix on the same matplotlib release.
    "matplotlib>=3.6,<3.10",
    "glfw>=2.5",
    "PyOpenGL>=3.1.6",
    "imgui[glfw]>=2.0"
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=4.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10"
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10"
]

[project.urls]
Homepage = "https://github.com/AkarisDimitry/GLPlot"
Repository = "https://github.com/AkarisDimitry/GLPlot"
Issues = "https://github.com/AkarisDimitry/GLPlot/issues"

[tool.hatch.build.targets.wheel]
packages = ["glplot"]

[tool.hatch.build.targets.sdist]
include = [
    "/glplot",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--cov=glplot --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]
known_first_party = ["glplot"]
