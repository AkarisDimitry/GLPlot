# Read the Docs configuration file
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2/

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

# HTML only. A LaTeX failure while building the PDF fails the whole build and leaves the
# published site stale; add `formats: [pdf, epub]` back once those builds are known good.
formats: []
