# The same four checks as CI (.github/workflows/lint.yml), run on staged files.
# Local hooks use the tools installed by `pip install -e ".[dev]"`, so the versions can
# never differ from the ones CI and the rest of the project use.
#
#   pip install -e ".[dev]" && pre-commit install
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        files: ^(glplot|tests)/
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: no-large-files
        name: no files over 1 MB
        entry: python -c "import os, sys; bad = [f for f in sys.argv[1:] if os.path.getsize(f) > 1_000_000]; print('\n'.join(f'{f}: over 1 MB' for f in bad)); sys.exit(bool(bad))"
        language: system
        pass_filenames: true
        exclude: ^glplot/gui/assets/
