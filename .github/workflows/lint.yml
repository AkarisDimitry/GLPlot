name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Bounded: an unpinned formatter reformats (or re-orders imports) on its own release
        # schedule and turns a green main red. Move the bounds up deliberately.
        pip install "flake8>=7,<8" "black>=26,<27" "isort>=8,<10" "ruff>=0.15,<0.18"

    - name: Check code formatting with black
      run: black --check glplot tests examples

    - name: Check import sorting with isort
      run: isort --check-only glplot tests examples

    - name: Lint with flake8
      run: flake8 glplot tests

    - name: Lint with ruff
      run: ruff check glplot tests examples
