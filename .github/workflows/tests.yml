name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # GLPlot's runtime dependencies are ranges, so a new imgui-bundle or matplotlib release
  # can break it with no commit here. A weekly run makes that show up as a red badge.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A hung step (e.g. apt waiting on a dpkg lock, or a blocking GLFW/OpenGL call
    # pytest-timeout can't preempt) used to silently eat GitHub's 6-hour default job
    # timeout with no indication of where it got stuck. 25 minutes is generous next
    # to the local run; it just guarantees a fast, legible failure instead.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install headless OpenGL libraries (Linux)
      if: runner.os == 'Linux'
      timeout-minutes: 5
      run: |
        # GitHub's Ubuntu runners default to a regional azure.archive.ubuntu.com
        # mirror that is occasionally slow or unreachable, and plain apt-get can
        # sit retrying it for many minutes before falling back. Bound each
        # attempt's own timeout/retry count, and retry the whole thing a few
        # times, so a transient mirror blip fails fast and self-heals instead
        # of eating most of this step's 5-minute budget.
        APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
        for attempt in 1 2 3; do
          sudo apt-get update $APT_OPTS && break
          echo "apt-get update failed (attempt $attempt/3), retrying..." >&2
          sleep 5
        done
        sudo apt-get install -y $APT_OPTS libglvnd0 libgl1 libglu1-mesa libosmesa6 xvfb

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: MCP tool schemas are current
      # The built-in MCP server (used when the `mcp` package is absent) serves the tool schemas
      # from glplot/mcp/tools.json, a snapshot of what the SDK server publishes. This fails when a
      # tool's signature or description changed and the snapshot did not:
      #   python -m glplot.mcp.schema --write
      timeout-minutes: 3
      run: python -m glplot.mcp.schema --check

    - name: OpenGL smoke test (Linux, Mesa software rendering under a virtual display)
      # The suite runs without a window, so it cannot tell a working GL context from a
      # silent fall back to matplotlib. This asks for the OpenGL renderer explicitly and
      # checks that pixels came out (tools/gl_smoke.py).
      if: runner.os == 'Linux'
      timeout-minutes: 5
      run: xvfb-run -a python tools/gl_smoke.py

    - name: Run tests with coverage (Linux, under a virtual display)
      if: runner.os == 'Linux'
      # test_gallery_scripts_build_without_rendering alone now carries its own 600s
      # timeout (tests/test_gallery_integration.py) -- 26 example scripts under real
      # coverage tracing measured at ~75s locally, and CI runners have shown
      # measurably less single-threaded headroom than that. 15 minutes covers that
      # test's own worst case plus the rest of the suite (~2-3 min uninstrumented).
      timeout-minutes: 15
      run: |
        xvfb-run -a pytest --cov=glplot --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

    - name: Warm the matplotlib font cache (Windows)
      # matplotlib builds its font list lazily on first use, by scanning every font on
      # the machine -- on a fresh Windows runner this can take well over the suite's
      # per-test 60s timeout (see pyproject.toml), and the animation/preview pipeline's
      # gallery-integration test is typically the first thing in the whole run to draw
      # real text through the Agg backend, so *that* test is the one left holding a
      # timeout that has nothing to do with its own code. Building the cache here, in
      # its own step with its own generous budget, keeps a one-time cold start off any
      # single test's clock; the cache then lives in %USERPROFILE%\.matplotlib for the
      # pytest step that follows.
      if: runner.os == 'Windows'
      timeout-minutes: 5
      run: |
        python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot as plt; fig = plt.figure(); ax = fig.add_subplot(); ax.set_title('warm'); fig.canvas.draw(); plt.close(fig)"

    - name: Run tests with coverage
      if: runner.os != 'Linux'
      # See the Linux step's comment: the gallery-integration test's own 600s budget
      # is what this needs room for.
      timeout-minutes: 15
      run: |
        pytest --cov=glplot --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

    - name: Annotate the failed tests
      # The job log needs a login to read; annotations do not, so a red run says which test
      # failed (and why, in one line) on the run's summary page and through the checks API.
      if: failure()
      shell: python {0}
      run: |
        import os
        import xml.etree.ElementTree as ET

        if not os.path.exists("junit.xml"):
            print("::error title=pytest::no junit.xml was written (the run died before reporting)")
        else:
            for case in ET.parse("junit.xml").getroot().iter("testcase"):
                bad = case.find("failure")
                if bad is None:
                    bad = case.find("error")
                if bad is None:
                    continue
                reason = (bad.get("message") or "").splitlines()[:1]
                reason = reason[0][:300] if reason else ""
                name = f"{case.get('classname')}::{case.get('name')}"
                print(f"::error title=failed test::{name} -- {reason}".replace("%", "%25"))

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false


  no-sdk:
    # `pip install glplot` on its own must be enough for an MCP client to connect: the built-in
    # stdio server and the documentation tools use nothing beyond GLPlot's own dependencies. Every
    # other job installs `.[test]`, which pulls in the `mcp` SDK, so without this job the no-SDK
    # path would only ever be exercised through mocks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install headless OpenGL libraries
      timeout-minutes: 5
      run: |
        APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
        sudo apt-get update $APT_OPTS || true
        sudo apt-get install -y $APT_OPTS libglvnd0 libgl1 libglu1-mesa libosmesa6

    - name: Install GLPlot without the MCP SDK
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest pytest-timeout
        python -c "import importlib.util as u; assert u.find_spec('mcp') is None, 'the SDK must not be installed in this job'"

    - name: glplot-mcp doctor (install check and protocol self-test)
      timeout-minutes: 3
      run: |
        glplot-mcp doctor
        python -m glplot.llm doctor

    - name: MCP and documentation tests without the SDK
      timeout-minutes: 8
      run: |
        pytest -o addopts="" -p no:cacheprovider tests/test_mcp_builtin.py tests/test_mcp_cli.py \
          tests/test_mcp_knowledge.py tests/test_mcp_toolbox.py tests/test_mcp_state.py \
          tests/test_mcp_recipes.py tests/test_mcp_analysis.py tests/test_mcp_review.py \
          tests/test_mcp_http.py tests/test_mcp_textdata.py tests/test_mcp_dynamics.py \
          tests/test_mcp_motion.py tests/test_mcp_animation.py tests/test_mcp_simulate.py \
          tests/test_mcp_script.py tests/test_llm_docs.py
