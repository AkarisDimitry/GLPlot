name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A hung step (e.g. apt waiting on a dpkg lock, or a blocking GLFW/OpenGL call
    # pytest-timeout can't preempt) used to silently eat GitHub's 6-hour default job
    # timeout with no indication of where it got stuck. 20 minutes is generous next
    # to the ~1-minute local run; it just guarantees a fast, legible failure instead.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install headless OpenGL libraries (Linux)
      if: runner.os == 'Linux'
      timeout-minutes: 5
      run: |
        # GitHub's Ubuntu runners default to a regional azure.archive.ubuntu.com
        # mirror that is occasionally slow or unreachable, and plain apt-get can
        # sit retrying it for many minutes before falling back. Bound each
        # attempt's own timeout/retry count, and retry the whole thing a few
        # times, so a transient mirror blip fails fast and self-heals instead
        # of eating most of this step's 5-minute budget.
        APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
        for attempt in 1 2 3; do
          sudo apt-get update $APT_OPTS && break
          echo "apt-get update failed (attempt $attempt/3), retrying..." >&2
          sleep 5
        done
        sudo apt-get install -y $APT_OPTS libglvnd0 libgl1 libglu1-mesa libosmesa6 xvfb

    - name: Install dependencies
      timeout-minutes: 5
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run tests with coverage (Linux, under a virtual display)
      if: runner.os == 'Linux'
      timeout-minutes: 10
      run: |
        xvfb-run -a pytest --cov=glplot --cov-report=term-missing --cov-report=xml

    - name: Run tests with coverage
      if: runner.os != 'Linux'
      timeout-minutes: 10
      run: |
        pytest --cov=glplot --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
