stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# Lint stage
lint:
  stage: lint
  image: python:3.12
  script:
    - pip install --upgrade pip
    - pip install black isort flake8
    - echo "Running Black..."
    - black --check --line-length 100 .
    - echo "Running isort..."
    - isort --check-only .
    - echo "Running flake8..."
    - flake8 glplot tests --count --select=E9,F63,F7,F82 --show-source --statistics
  allow_failure: true

# Test stage - Python 3.9
test-py39:
  stage: test
  image: python:3.9
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq libgl1-mesa-glx libglu1-mesa
    - pip install --upgrade pip
    - pip install -e ".[test]"
  script:
    - pytest tests/ -v --cov=glplot --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days

