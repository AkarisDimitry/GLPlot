# Build stage
build:
  stage: build
  image: python:3.12
  before_script:
    - pip install --upgrade pip
    - pip install build twine
  script:
    - python -m build
    - twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 30 days
  only:
    - main
    - tags
